spring.application.name=quickserve
server.port=8080

# ---------- Database (values come from environment variables) ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickserve_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" creates/updates tables automatically (fine for a learning project).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Initial admin account ----------
app.admin.name=${ADMIN_NAME:QuickServe Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- CORS (frontend origin) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
